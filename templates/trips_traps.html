<html>
<script>
    async function makeMove(cellIndex) {
        const response = await fetch("/move", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({cell_index: cellIndex})
        });

        const data = await response.json();
        if (data.message == '1'){document.getElementById(cellIndex).innerHTML = data.player;}
        if (data.won == "1"){document.getElementById("winner").innerHTML = 'Won player ' + data.winner;}
    } 
</script>
<head>
<style>
body{
    background-color: black;
}
:root {
    --box_size: 150px;
}
.container .field{
  display: inline-grid;
  grid-template-columns: var(--box_size) var(--box_size) var(--box_size) ;
  grid-template-rows: var(--box_size) var(--box_size) var(--box_size);
  background-color: dodgerblue;
  padding: 10px;
}
.container div, .testbtn {
  background-color: #f1f1f1;
  border: 1px solid black;
  line-height: var(--box_size);
  vertical-align: sub;
  font-size: var(--box_size);
  font-weight: var(--box_size);
  text-align: center;
}
button {
    border: none;
    padding: 0px;
}
.testbtn:hover div{
    background-color: rgb(219, 74, 195);
}
</style>
</head>
<body>

<div class="container">
   <div class="field">
    {% block content %}{% endblock %}
   </div>
   <div id="winner"></div>
</div>
</body>
</html>
