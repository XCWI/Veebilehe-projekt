<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rise of Humanity | Game</title>
    <!-- Ühendab game.css kujundusfaili -->
    <link rel="stylesheet" href="../static/css/game.css">
    <style>
        .unlocked-content-item {
            transition: opacity 2.5s ease;
        }

        .unlocked-content-item.discovery-new {
            animation: discovery-appear 1s ease both;
        }

        @keyframes discovery-appear {
            from { opacity: 0; transform: translateY(-0.5rem); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="game-layout">
        
        <!-- VASAK POOL: Päis, kategooriad, kastid ja alumine story-logi -->
        <div class="main-area">
            
            <!-- Ülemine riba -->
            <header class="top-bar">
                <a href="home.html" class="back-link">← Back to Home</a>
                <div class="quick-actions">
                    <button id="start_btn" class="btn-start" onclick="startStopGame()">Start Game</button>
                </div>
            </header>
            <!-- Kategooriate riba (ainult game_data.txt asjad: Food/Farming ja Buildings) -->
            <nav class="category-tabs">
                <button class="tab-btn active" onclick="showUpgradeCategory('farming')">FARMING</button>
                <button class="tab-btn" onclick="showUpgradeCategory('buildings')">BUILDINGS</button>
                <button class="tab-btn" onclick="showUpgradeCategory('wood')">Wood production</button>
                <button class="tab-btn" onclick="showUpgradeCategory('mining')">Mining</button>
                <button class="tab-btn" onclick="showUpgradeCategory('knowledge')">Education / knowledge</button>
                <button class="tab-btn" onclick="showUpgradeCategory('nature')">Nature</button>
                <button class="tab-btn" onclick="showUpgradeCategory('continents')">Continents</button>
            </nav>

            <!-- Keskmine ala: Uuenduste kastid -->
            <main class="upgrades-workspace">
                <div id="upgrades-grid" class="upgrades-grid"></div>
            </main>

            <!-- Alumine kast: Story & Log -->
            <section class="story-box">
                <h3 class="story-title">STORY &amp; LOG</h3>
                <div id="story-log" class="story-log">
                    <p class="story-entry">› Press "Start Game" to begin...</p>
                </div>
            </section>
        </div>

        <!-- PAREM POOL: STATS (täpselt game_data.txt väljad) -->
        <aside class="right-sidebar">
            <section class="stats-box">
                <h2 class="panel-title">STATS</h2>
                <table class="stats-table">
                    <tr><td class="stat-label">Population</td><td class="stat-value" id="population">0</td></tr>
                    <tr><td class="stat-label">Population Cap</td><td class="stat-value" id="populationCap">0</td></tr>
                    <tr><td class="stat-label">Growth Rate</td><td class="stat-value" id="growthRate">0</td></tr>
                    <tr><td class="stat-label">Food</td><td class="stat-value" id="food">0</td></tr>
                    <tr><td class="stat-label">stone</td><td class="stat-value" id="stone">0</td></tr>
                    <tr><td class="stat-label">wood</td><td class="stat-value" id="wood">0</td></tr>
                    <tr><td class="stat-label">iron</td><td class="stat-value" id="iron">0</td></tr>
                    <tr><td class="stat-label">Knowledge</td><td class="stat-value" id="knowledge">0</td></tr>

                </table>

                <div class="continent-info">
                    <div><strong>Discovered Continents:</strong> <span id="discoveredContinents">None</span></div>
                </div>
            </section>

        </main>

    </div>
    <script src="../static/js/mang.js"></script>
    <script src="../static/js/game_unlock_list_logic.js"></script>
    <script src="../static/js/game_upgade_list_logic.js"></script>
</body>
</html>
